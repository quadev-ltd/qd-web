name: Push to main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Runs the same checks as pr.yml. Production (quadev.net) is not deployed from here: it is
  # released by a version tag (release.yml).
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: App-link files unchanged in the build output
        run: yarn check:well-known

      - name: No preview auth gateway in the build output
        run: yarn check:bundle

  # The website against the real backend code (the emulators of quadev-backend at the commit
  # in e2e-emulators/backend-commit). On `main` it always runs, so a change that slipped
  # past the path list of pr.yml shows here. It does not hold back the dev deploy.
  # Skipped until the owner has created the secret BACKEND_DEPLOY_KEY.
  e2e-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Say why nothing ran
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "Skipped: the secret BACKEND_DEPLOY_KEY does not exist yet." >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end tests against the backend's emulators
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: ./.github/actions/e2e-emulators
        with:
          backend-deploy-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

  # Deploys the dev build (.env.dev) to Firebase Hosting on quadevapp-dev (alias `dev` in
  # .firebaserc): https://quadevapp-dev.web.app. It starts once the checks have passed.
  # Authenticates with Workload Identity Federation (no JSON key). The job is skipped until
  # the owner runs scripts/setup-wif.sh and sets the repository variables WIF_PROVIDER_DEV
  # and WIF_SERVICE_ACCOUNT_DEV (README, "Deploy").
  deploy-dev:
    needs: run-checks
    if: vars.WIF_PROVIDER_DEV != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One dev deploy at a time; a newer push waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # Only this job can ask for the identity token that Google Cloud exchanges for deploy rights.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (dev configuration)
        run: yarn build:dev

      - name: App-link files unchanged in the build output
        run: yarn check:well-known

      # `yarn check:bundle` is not run on this build on purpose. It keeps the preview auth
      # gateway out of PRODUCTION builds, and run-checks has run it on the production build.
      # The dev build is configured with that gateway (.env.dev) and contains it by design.

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT_DEV }}

      # `yarn firebase` runs the pinned firebase-tools (package.json).
      - name: Deploy to Firebase Hosting (dev)
        run: yarn firebase deploy --only hosting --project dev --non-interactive --message "$GITHUB_SHA"
