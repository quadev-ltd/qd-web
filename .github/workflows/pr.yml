name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps the job name used by the previous workflow and by qd-mobile.
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: App-link files unchanged in the build output
        run: yarn check:well-known

      - name: No preview auth gateway in the build output
        run: yarn check:bundle
