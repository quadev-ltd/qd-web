name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps the job name used by the previous workflow and by qd-mobile.
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: App-link files unchanged in the build output
        run: yarn check:well-known

      - name: No preview auth gateway in the build output
        run: yarn check:bundle

  # The two critical flows, an accessibility scan and a layout check of every page, in
  # Chromium at desktop and phone sizes, against the preview auth gateway (no backend).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium for Playwright
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The website with the Firebase gateway against the real backend code: the emulators of
  # quadev-backend at the commit in e2e-emulators/backend-commit, with its fake model
  # (README, "End-to-end tests against the backend's emulators").
  # The job always reports a result, and does the work only when it can fail:
  # - the pull request touches what the tests go through (the list below);
  # - the deploy key of the private backend is there. It is not for a pull request from a
  #   fork or from Dependabot (they get no secrets), and not before the owner has created it.
  e2e-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent (the target branch), to list what changed.
          fetch-depth: 2

      - name: Decide whether the tests have something to prove
        id: decide
        run: |
          paths='^(src/core/(firebase|profile|flags|auth|session)/|src/screens/(Profile|SignIn)/|src/app/|e2e-emulators/|playwright\.emulators\.config\.ts$|scripts/e2e-emulators\.sh$|\.github/actions/e2e-emulators/|\.github/workflows/pr\.yml$|package\.json$|yarn\.lock$|vite\.config\.ts$|\.env\.dev$)'
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: the secret BACKEND_DEPLOY_KEY is not available to this run." >> "$GITHUB_STEP_SUMMARY"
          elif git diff --name-only HEAD^1 HEAD | grep -qE "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: this pull request changes nothing the emulator tests go through." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: End-to-end tests against the backend's emulators
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/e2e-emulators
        with:
          backend-deploy-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

  # A temporary copy of the pull request on Firebase Hosting: the dev build (.env.dev) on the
  # preview channel `pr-<number>` of quadevapp-dev (alias `dev` in .firebaserc). The channel
  # expires 7 days after the last push; its address is written to the job summary.
  # Authenticates with Workload Identity Federation (no JSON key). The job is skipped until
  # the owner runs scripts/setup-wif.sh and sets the repository variables WIF_PROVIDER_DEV
  # and WIF_SERVICE_ACCOUNT_DEV (README, "Deploy"). It never runs for a pull request from a
  # fork or from Dependabot: those get no identity token, and their code must not be given
  # deploy rights. It is not a required check.
  preview:
    needs: [run-checks, e2e]
    if: >-
      vars.WIF_PROVIDER_DEV != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job can ask for the identity token that Google Cloud exchanges for deploy rights.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (dev configuration)
        run: yarn build:dev

      - name: App-link files unchanged in the build output
        run: yarn check:well-known

      # `yarn check:bundle` is not run on this build on purpose. It keeps the preview auth
      # gateway out of PRODUCTION builds, and run-checks has run it on the production build.
      # The dev build is configured with that gateway (.env.dev) and contains it by design.

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT_DEV }}

      # `yarn firebase` runs the pinned firebase-tools (package.json). With --json the command
      # prints only its result, which holds the address of the channel.
      # --no-authorized-domains: the address is not added to the sign-in domains of Firebase
      # Authentication, so the deploy account needs no rights over users.
      - name: Deploy to the preview channel
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          result="$RUNNER_TEMP/preview.json"
          status=0
          yarn firebase hosting:channel:deploy "$CHANNEL" --project dev --expires 7d \
            --no-authorized-domains --non-interactive --json > "$result" || status=$?
          cat "$result"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.web\.app' "$result" | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "The deploy result has no preview address." >&2
            exit 1
          fi
          {
            echo "### Preview of this pull request"
            echo
            echo "$url"
            echo
            echo "Dev build on the Firebase Hosting channel \`$CHANNEL\` (project quadevapp-dev). It expires 7 days after the last push."
          } >> "$GITHUB_STEP_SUMMARY"
